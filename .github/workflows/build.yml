name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Machine figée : ne bouge pas sans que tu le décides (contrairement à ubuntu-latest)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: SDK Android (licences et composants figés)
        run: |
          set +o pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Dézipper et trouver la racine du projet
        run: |
          ZIP=""
          if [ -f projet.zip ]; then
            ZIP="projet.zip"
          else
            ZIP=$(ls -1 *.zip 2>/dev/null | head -n1 || true)
          fi
          if [ -z "$ZIP" ]; then
            echo "::error::Aucun fichier .zip trouvé à la racine du dépôt"
            exit 1
          fi
          echo "Zip utilisé : $ZIP"
          rm -rf projet && mkdir projet
          unzip -q -o "$ZIP" -d projet
          SETTINGS=$(find projet -maxdepth 4 -name 'settings.gradle*' | head -n1)
          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle introuvable dans le zip"
            exit 1
          fi
          ROOT=$(dirname "$SETTINGS")
          echo "Racine du projet : $ROOT"
          echo "PROJECT_DIR=$ROOT" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Clé de signature stable
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "Clé restaurée depuis le secret DEBUG_KEYSTORE_BASE64"
          elif [ -f debug.keystore ]; then
            cp debug.keystore ~/.android/debug.keystore
            echo "Clé restaurée depuis debug.keystore (dépôt)"
          else
            echo "::warning::Aucune clé stable trouvée : une nouvelle clé sera générée, l'APK ne pourra pas se mettre à jour par-dessus l'ancien."
          fi

      - name: Compiler
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Récupérer l'APK
        run: |
          mkdir -p sortie
          APK=$(find "$PROJECT_DIR" -path '*build/outputs/apk/debug/*.apk' | head -n1)
          if [ -z "$APK" ]; then
            echo "::error::APK introuvable après la compilation"
            exit 1
          fi
          cp "$APK" sortie/app-debug.apk
          ls -l sortie

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: sortie/app-debug.apk
          if-no-files-found: error
