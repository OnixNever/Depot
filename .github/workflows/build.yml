name: Build APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Dézipper et trouver la racine du projet
        id: root
        run: |
          mkdir work
          unzip -q project.zip -d work
          S=$(find work -maxdepth 5 \( -name settings.gradle -o -name settings.gradle.kts \) -printf '%d %p\n' | sort -n | head -n 1 | cut -d' ' -f2-)
          if [ -z "$S" ]; then echo "Aucun settings.gradle trouvé dans le ZIP"; exit 1; fi
          ROOT=$(dirname "$S")
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          GV=8.7
          P="$ROOT/gradle/wrapper/gradle-wrapper.properties"
          if [ -f "$P" ]; then
            V=$(grep -oE 'gradle-[0-9]+(\.[0-9]+)*' "$P" | head -n 1 | sed 's/gradle-//')
            if [ -n "$V" ]; then GV="$V"; fi
          fi
          echo "gradle=$GV" >> "$GITHUB_OUTPUT"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.root.outputs.gradle }}

      - name: Clé de signature stable
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Compiler
        working-directory: ${{ steps.root.outputs.root }}
        run: |
          if [ -f gradlew ] && [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Récupérer l'APK
        run: |
          APK=$(find work -path '*build/outputs/apk/debug/*.apk' | head -n 1)
          if [ -z "$APK" ]; then echo "APK introuvable"; exit 1; fi
          cp "$APK" app-debug.apk

      - name: Publier l'APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for t in $(gh release list --limit 100 --json tagName -q '.[].tagName'); do
            gh release delete "$t" --cleanup-tag --yes
          done
          gh release create "build-${{ github.run_number }}" app-debug.apk \
            --title "APK #${{ github.run_number }}" --notes "Généré par APK Builder"
