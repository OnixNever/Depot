name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Machine figée : ne bouge pas sans que tu le décides (contrairement à ubuntu-latest)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: SDK Android (licences et composants figés)
        run: |
          set +o pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Dézipper et trouver la racine du projet
        run: |
          ZIP=""
          if [ -f projet.zip ]; then
            ZIP="projet.zip"
          else
            ZIP=$(ls -1 *.zip 2>/dev/null | head -n1 || true)
          fi
          if [ -z "$ZIP" ]; then
            echo "::error::Aucun fichier .zip trouvé à la racine du dépôt"
            exit 1
          fi
          echo "Zip utilisé : $ZIP"
          rm -rf projet && mkdir projet
          unzip -q -o "$ZIP" -d projet
          SETTINGS=$(find projet -maxdepth 4 -name 'settings.gradle*' | head -n1)
          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle introuvable dans le zip"
            exit 1
          fi
          ROOT=$(dirname "$SETTINGS")
          echo "Racine du projet : $ROOT"
          echo "PROJECT_DIR=$ROOT" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          # Cache désactivé : un cache corrompu ("jar introuvable") était restauré à chaque
          # lancement et faisait échouer tous les essais. Compilation un peu plus longue mais fiable.
          cache-disabled: true

      - name: Clé de signature stable
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -f debug.keystore ]; then
            cp debug.keystore ~/.android/debug.keystore
            echo "Clé restaurée depuis debug.keystore (envoyée par APK Builder)"
          elif [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "Clé restaurée depuis le secret DEBUG_KEYSTORE_BASE64"
          else
            echo "::warning::Aucune clé stable trouvée : une nouvelle clé sera générée, l'APK ne pourra pas se mettre à jour par-dessus l'ancien."
          fi

      - name: Forcer la signature stable
        run: |
          KS="$HOME/.android/debug.keystore"
          [ -f "$KS" ] || { echo "::error::Cle absente : $KS"; exit 1; }
          # Copie dans tous les emplacements ou Gradle / le plugin Android peuvent la chercher
          for D in "${ANDROID_USER_HOME:-}" "${ANDROID_SDK_HOME:-}/.android" "$HOME/.android"; do
            [ -n "$D" ] && [ "$D" != "/.android" ] || continue
            mkdir -p "$D" && cp -f "$KS" "$D/debug.keystore" 2>/dev/null || true
          done
          mkdir -p "$HOME/.gradle/init.d"
          cat > "$HOME/.gradle/init.d/apkbuilder-signing.gradle" <<'GRADLE_EOF'
          allprojects {
            afterEvaluate { p ->
              if (p.plugins.hasPlugin("com.android.application")) {
                def ks = new File(System.getenv("HOME"), ".android/debug.keystore")
                p.android.signingConfigs.debug {
                  storeFile ks
                  storePassword "android"
                  keyAlias "androiddebugkey"
                  keyPassword "android"
                }
                p.android.buildTypes.all { bt ->
                  if (bt.name == "debug" || bt.name == "release") { bt.signingConfig = p.android.signingConfigs.debug }
                }
                println "APK Builder : signature forcee avec " + ks
              }
            }
          }
          GRADLE_EOF
          echo "Script de signature Gradle installe"

      - name: Filets de sécurité réseau (miroirs Maven + test)
        run: |
          mkdir -p "$HOME/.gradle/init.d"
          cat > "$HOME/.gradle/init.d/apkbuilder-repos.gradle" <<'GRADLE_EOF'
          // APK Builder : depots de secours, utilises seulement si Maven Central ne trouve pas un fichier
          def apkMirrors = [
            "https://repo1.maven.org/maven2/",
            "https://maven-central.storage-download.googleapis.com/maven2/"
          ]
          settingsEvaluated { settings ->
            try {
              settings.pluginManagement.repositories {
                apkMirrors.each { u -> maven { url u } }
              }
            } catch (Throwable t) { println "APK Builder : miroirs plugins ignores : " + t.message }
            try {
              settings.dependencyResolutionManagement.repositories {
                apkMirrors.each { u -> maven { url u } }
              }
            } catch (Throwable t) { println "APK Builder : miroirs dependances ignores : " + t.message }
          }
          allprojects { p ->
            try {
              p.buildscript.repositories {
                apkMirrors.each { u -> maven { url u } }
              }
            } catch (Throwable t) { println "APK Builder : miroirs buildscript ignores : " + t.message }
          }
          GRADLE_EOF
          echo "Miroirs de secours installes"
          # Test de connexion : visible dans le journal pour comprendre un échec futur
          for U in \
            "https://repo.maven.apache.org/maven2/org/jetbrains/kotlin/kotlin-stdlib/1.9.23/kotlin-stdlib-1.9.23.jar" \
            "https://repo1.maven.org/maven2/org/jetbrains/kotlin/kotlin-stdlib/1.9.23/kotlin-stdlib-1.9.23.jar" \
            "https://maven-central.storage-download.googleapis.com/maven2/org/jetbrains/kotlin/kotlin-stdlib/1.9.23/kotlin-stdlib-1.9.23.jar" \
            "https://dl.google.com/dl/android/maven2/com/android/tools/build/gradle/8.5.2/gradle-8.5.2.pom"; do
            CODE=$(curl -s -o /dev/null -I -m 25 -w '%{http_code}' "$U" || true)
            echo "Test réseau : HTTP ${CODE:-erreur} <- $U"
          done

      - name: Numero de version automatique
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          # Minutes depuis 1970 : toujours croissant, Android accepte alors la mise à jour par-dessus
          VC=$(( $(date +%s) / 60 ))
          echo "versionCode automatique : $VC"
          for f in $(grep -rl --include='build.gradle' --include='build.gradle.kts' 'com.android.application' . | grep -v '/build/'); do
            grep -q 'defaultConfig' "$f" || continue
            if grep -q 'versionCode' "$f"; then
              sed -i -E "s/(versionCode[[:space:]]*=?[[:space:]]*)[0-9]+/\1$VC/" "$f"
            else
              sed -i -E "0,/defaultConfig[[:space:]]*\{/s//&\n        versionCode = $VC/" "$f"
            fi
            echo "Fichier $f :"
            grep -n 'versionCode' "$f" || echo "::warning::versionCode non appliqué dans $f"
          done

      - name: Compiler
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            CMD="./gradlew"
          else
            CMD="gradle"
          fi
          GOPTS="--no-daemon --stacktrace -Dorg.gradle.internal.http.connectionTimeout=60000 -Dorg.gradle.internal.http.socketTimeout=120000 -Dorg.gradle.internal.repository.max.retries=5 -Dorg.gradle.internal.repository.initial.backoff=2000"
          # 4 essais. Avant chaque nouvel essai on vide le cache des dépendances : Gradle mémorise
          # les "fichier introuvable" et sinon les essais suivants échouent en 4 s sans rien retélécharger.
          for i in 1 2 3 4; do
            EXTRA=""
            if [ "$i" -gt 1 ]; then
              echo "Nettoyage du cache des dépendances avant l'essai $i"
              rm -rf "$HOME/.gradle/caches/modules-2"
              EXTRA="--refresh-dependencies"
            fi
            "$CMD" assembleDebug $GOPTS $EXTRA && exit 0
            echo "::warning::Tentative $i échouée"
            [ "$i" -lt 4 ] && sleep $((i * 30))
          done
          exit 1

      - name: Verifier signature et version de l APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          EXPECTED="5270b4cdd7c31b1d3e05c78bd4ebcbfb4ddea828d441a2221fed30edf74056c4"
          APK=$(find . -name '*.apk' -path '*/build/*' | head -1)
          if [ -z "$APK" ]; then echo "::warning::Aucun APK trouve pour la verification"; exit 0; fi
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BT=$(ls -d "$SDK"/build-tools/* 2>/dev/null | sort -V | tail -1 || true)
          echo "APK verifie : $APK"
          if [ -z "$BT" ] || [ ! -x "$BT/apksigner" ]; then
            echo "::warning::apksigner introuvable, verification impossible"
            exit 0
          fi
          if [ -x "$BT/aapt2" ]; then
            "$BT/aapt2" dump badging "$APK" 2>/dev/null | grep -m1 '^package:' || true
          fi
          GOT=$("$BT/apksigner" verify --print-certs "$APK" 2>/dev/null | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}' || true)
          echo "Signature SHA-256 de l'APK : $GOT"
          if [ "$GOT" = "$EXPECTED" ]; then
            echo "Signature OK : cle stable APK Builder"
          else
            echo "::warning::Signature differente de la cle stable : cet APK ne se mettra pas a jour par-dessus un APK signe avec la cle stable"
          fi

      - name: Récupérer l'APK
        run: |
          mkdir -p sortie
          APK=$(find "$PROJECT_DIR" -path '*build/outputs/apk/debug/*.apk' | head -n1)
          if [ -z "$APK" ]; then
            echo "::error::APK introuvable après la compilation"
            exit 1
          fi
          cp "$APK" sortie/app-debug.apk
          ls -l sortie

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: sortie/app-debug.apk
          if-no-files-found: error
